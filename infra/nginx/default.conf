# Nginx del frontend SOLV.
#
# Solo sirve el paquete estático de Angular. El tráfico de /api y /ws lo enruta
# Traefik directo al backend, así que este servidor no hace proxy.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;

    # Sonda de vida del propio Nginx: no depende del backend.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # El index nunca se cachea: un index viejo referencia assets que ya no
    # existen tras una actualización.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Assets con hash en el nombre: cache largo e inmutable.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|webp|ico|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # Rutas del SPA: cualquier ruta desconocida vuelve al index.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
