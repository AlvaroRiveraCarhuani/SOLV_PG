# Configuración dinámica de Traefik (proveedor file).
#
# El enrutamiento del sitio principal ya no vive acá: lo publican las etiquetas
# de los servicios backend y frontend en compose.yml, para que el host salga de
# SOLV_HOST y no de un literal en este archivo.
#
# Este archivo conserva el middleware de autenticación perimetral que usan los
# entornos de práctica: los contenedores de OpenVSCode se enrutan por etiquetas
# propias (Host `<uuid>.<dominio>`) y pueden referenciar `solv-forwardauth@file`.

http:
  middlewares:
    solv-forwardauth:
      forwardAuth:
        address: "http://solv_backend:3000/api/v1/auth/verify"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-User-Id"
          - "X-User-Role"
