certificatesResolvers:
  letsencrypt:
    acme:
      # email se inyecta por TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL
      # (ver compose.yml): el archivo NO expande ${...}, y su valor literal
      # pisa al env, así que no debe declararse acá.
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: desec
        delayBeforeCheck: 10

providers:
  docker:
    exposedByDefault: false
  file:
    filename: /etc/traefik/dynamic_conf.yml

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
