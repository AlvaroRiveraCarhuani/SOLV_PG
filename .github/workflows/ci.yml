name: SOLV DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Go Tests & Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Semgrep CLI
        run: |
          pipx install semgrep || pip install semgrep

      - name: Install PostgreSQL & Start Docker Services
        run: |
          docker compose up -d postgres
          docker compose ps

      - name: Wait for PostgreSQL to be ready
        run: |
          until docker compose exec -T postgres pg_isready -U solv_user -d solv_db; do
            echo "Waiting for PostgreSQL to accept connections..."
            sleep 2
          done

      - name: Run Go Unit and Integration Tests
        env:
          DATABASE_URL: "postgres://solv_user:solv_password@127.0.0.1:5432/solv_db?sslmode=disable"
        run: |
          cd backend
          go test -v ./... -count=1

  frontend-build:
    name: Frontend Angular Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          cd frontend
          npm install --legacy-peer-deps

      - name: Build Angular Application
        run: |
          cd frontend
          npm run build --if-present

  security-scan:
    name: DevSecOps Semgrep Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Semgrep AST Security Scan
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
