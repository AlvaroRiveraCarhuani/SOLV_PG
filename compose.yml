services:
  traefik:
    image: traefik:v3.7.8
    container_name: solv_traefik
    environment:
      - DOCKER_API_VERSION=1.41
      - DESEC_TOKEN=${DESEC_TOKEN}
      - DESEC_API_BASE_URL=https://desec.io/api/v1/
      - ACME_EMAIL=${ACME_EMAIL}
      # Override idiomático: el traefik.yml montado NO expande ${...}
      # (Compose solo interpola su propio YAML), así que el email se
      # inyecta por variable TRAEFIK_* que sí pisa la config estática.
      - TRAEFIK_CERTIFICATESRESOLVERS_LETSENCRYPT_ACME_EMAIL=${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./infra/traefik/traefik.yml:/etc/traefik/traefik.yml:ro"
      - "./infra/traefik/dynamic_conf.yml:/etc/traefik/dynamic_conf.yml:ro"
      - "./letsencrypt/acme.json:/letsencrypt/acme.json"
    networks:
      - solv_net

  postgres:
    image: postgres:18-alpine
    container_name: solv_db
    environment:
      POSTGRES_USER: solv_user
      POSTGRES_PASSWORD: solv_password
      POSTGRES_DB: solv_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - solv_net

  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    container_name: solv_seaweedfs
    entrypoint: ["/bin/sh", "-c"]
    # El gateway S3 exige un archivo de identidades (-s3.config). Se genera al
    # arrancar desde variables de entorno, así el secreto no queda en el repo.
    # -volume.max=0 quita el tope de 8 volúmenes por servidor: cada bucket S3 es
    # una colección y con el valor por defecto el alta de un bucket nuevo falla
    # en cuanto el servidor ya tiene 8 volúmenes.
    command:
      - >-
        mkdir -p /etc/seaweedfs &&
        printf '{"identities":[{"name":"solv","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' "$$SEAWEEDFS_ACCESS_KEY" "$$SEAWEEDFS_SECRET_KEY" > /etc/seaweedfs/s3.json &&
        exec weed server -s3 -dir=/data -s3.port=8333 -ip.bind=0.0.0.0 -s3.config=/etc/seaweedfs/s3.json -volume.max=0
    environment:
      - SEAWEEDFS_ACCESS_KEY=${SEAWEEDFS_ACCESS_KEY:?definir SEAWEEDFS_ACCESS_KEY en .env}
      - SEAWEEDFS_SECRET_KEY=${SEAWEEDFS_SECRET_KEY:?definir SEAWEEDFS_SECRET_KEY en .env}
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - seaweed_data:/data
    networks:
      - solv_net

  prometheus:
    image: prom/prometheus:v2.51.1
    container_name: solv_prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - solv_net

  grafana:
    image: grafana/grafana:10.4.1
    container_name: solv_grafana
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - solv_net

networks:
  solv_net:
    name: solv_net
    driver: bridge

volumes:
  pg_data:
  seaweed_data:
