<section class="card-section">
  <div class="title-with-icon">
    <svg lucideMonitorPlay class="header-icon"></svg>
    <h3 class="card-title">Previsualización web</h3>
  </div>

  <div class="preview-grid">
    <div class="form-group">
      <label for="ide-app-run-command" class="form-label">Comando de arranque</label>
      <input
        id="ide-app-run-command"
        type="text"
        class="form-input font-mono"
        placeholder="npm run dev"
        [ngModel]="appRunCommand()"
        (ngModelChange)="onCommandChange($event)"
      />
      <span class="field-hint">Comando para levantar el servidor de la app.</span>
    </div>

    <div class="form-group port-group">
      <label for="ide-app-port" class="form-label">Puerto</label>
      <input
        id="ide-app-port"
        type="number"
        class="form-input font-mono"
        min="1"
        max="65535"
        placeholder="3000"
        [ngModel]="appPort() || null"
        (ngModelChange)="onPortChange($event)"
      />
      <span class="field-hint">Puerto web local (por defecto 3000).</span>
    </div>
  </div>
</section>
