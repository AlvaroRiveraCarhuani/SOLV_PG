@if (hasDatabaseService()) {
  <section class="card-section">
    <div class="title-with-icon">
      <svg lucideDatabase class="header-icon"></svg>
      <h3 class="card-title">Script inicial de base de datos</h3>
    </div>
    <p class="section-desc">
      Sentencias SQL para crear tablas o cargar datos al iniciar el laboratorio.
    </p>

    <div class="form-group">
      <textarea
        class="form-textarea font-mono"
        rows="8"
        placeholder="CREATE TABLE usuarios (id SERIAL PRIMARY KEY, nombre VARCHAR(100));&#10;INSERT INTO usuarios (nombre) VALUES ('Admin');"
        [ngModel]="dbInitScript()"
        (ngModelChange)="initScriptChange.emit($event)"
      ></textarea>
      <span class="field-hint">Sentencias separadas por punto y coma (;).</span>
    </div>
  </section>
}
