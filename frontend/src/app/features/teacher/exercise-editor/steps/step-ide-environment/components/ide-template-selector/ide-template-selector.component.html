<section class="card-section" id="template-section">
  <div class="section-header-row">
    <div class="title-with-icon">
      <svg lucideLayers class="header-icon"></svg>
      <div>
        <h3 class="card-title">Entorno de trabajo</h3>
        <span class="card-subtitle">Stack tecnológico y servicios del workspace</span>
      </div>
    </div>
    <button type="button" class="btn-outline btn-sm" (click)="requestTemplate.emit()">
      <svg lucidePlus class="btn-icon"></svg>
      <span>Solicitar nuevo entorno</span>
    </button>
  </div>

  <div class="form-group">
    <label class="form-label">
      Entorno homologado <span class="required">*</span>
    </label>
    <combobox
      [options]="templateOptions()"
      [value]="selectedTemplate()?.id || ''"
      [placeholder]="'Buscar o seleccionar entorno...'"
      [showSearchIcon]="true"
      [compact]="false"
      (optionSelected)="onTemplateOptionSelected($event)"
      inputAriaLabel="Seleccionar entorno homologado"
    />
  </div>

  @if (selectedTemplate(); as tpl) {
    <div class="template-detail-card">
      <div class="stack-identity-block">
        <div class="avatar-box" aria-hidden="true">
          <svg lucideLaptop class="avatar-icon"></svg>
        </div>

        <div class="stack-meta-info">
          <div class="stack-name-row">
            <span class="stack-name">{{ tpl.name }}</span>
            <span class="category-chip">Catálogo oficial</span>
          </div>

          <!-- Chips con Iconos Oficiales -->
          <div class="tech-badges-list">
            @for (badge of getTechBadges(tpl); track badge.label) {
              <span class="tech-chip">
                <tech-logo [iconType]="badge.icon" size="chip"></tech-logo>
                <span>{{ badge.label }}</span>
              </span>
            }
          </div>
        </div>
      </div>
    </div>
  } @else {
    <div class="empty-template-hint">
      <span>Elegí un entorno del catálogo para configurar el espacio de trabajo en VS Code.</span>
    </div>
  }
</section>
