<modal-shell
  [title]="exerciseToEdit() ? 'Editar Laboratorio' : 'Crear Nuevo Laboratorio'"
  subtitle="Diseño pedagógico asistido, modalidad de entorno, restricciones y evaluación."
  maxWidth="760px"
  [disableClose]="isSubmitting()"
  (close)="close.emit()"
>
  <svg modal-icon lucideCode class="icon"></svg>

  <!-- Barra de Pasos del Wizard -->
  <div class="wizard-steps-nav">
    <button
      type="button"
      class="wizard-step-btn"
      [class.active]="currentStep() === 1"
      [class.completed]="currentStep() > 1"
      (click)="goToStep(1)"
    >
      <span class="step-badge">1</span>
      <span class="step-text">Tipo y Enunciado</span>
    </button>

    <div class="step-divider"></div>

    <button
      type="button"
      class="wizard-step-btn"
      [class.active]="currentStep() === 2"
      [class.completed]="currentStep() > 2"
      (click)="goToStep(2)"
    >
      <span class="step-badge">2</span>
      <span class="step-text">
        {{ labType() === 'ALGORITMO' ? 'Casos de Prueba' : 'Entorno y Base de Datos' }}
      </span>
    </button>

    <div class="step-divider"></div>

    <button
      type="button"
      class="wizard-step-btn"
      [class.active]="currentStep() === 3"
      (click)="goToStep(3)"
    >
      <span class="step-badge">3</span>
      <span class="step-text">Reglas y Plantilla</span>
    </button>
  </div>

  <div class="wizard-body">
    @if (currentStep() === 1) {
      <step-general
        [(title)]="title"
        [titleError]="titleError()"
        (titleChanged)="onTitleChange($event)"
        [(dueDate)]="dueDate"
        [(hasDueDate)]="hasDueDate"
        [(labType)]="labType"
        [labTypeError]="labTypeError()"
        [lockLabType]="!!initialTemplate()"
        [lockedTemplateName]="initialTemplate()?.name || ''"
        [(pedagogicalPurpose)]="pedagogicalPurpose"
        [purposeError]="purposeError()"
        [(allowBroadcast)]="allowBroadcast"
        [(description)]="description"
      />
    }

    @if (currentStep() === 2) {
      <step-technical
        [labType]="labType() || 'ALGORITMO'"
        [(language)]="language"
        [(timeLimitMs)]="timeLimitMs"
        [(testCases)]="testCases"
        [(csvError)]="csvError"
        [(templateId)]="templateId"
        [templatesList]="templatesList()"
        [selectedTemplate]="selectedTemplate()"
        [hasDatabaseSatellite]="hasDatabaseSatellite()"
        [(dbInitScript)]="dbInitScript"
        (languageChanged)="onLanguageChange($event)"
        (requestTemplate)="openTemplateRequestModal()"
        (openFuzzing)="showFuzzingModal.set(true)"
      />
    }

    @if (currentStep() === 3) {
      <step-rules
        [(blockNativeSort)]="blockNativeSort"
        [(blockSystemModules)]="blockSystemModules"
        [(boilerplate)]="boilerplate"
        [language]="language()"
      />
    }
  </div>

  <!-- Footer con Acciones de Navegación y Guardado -->
  <div modal-footer class="wizard-footer-flex">
    <button
      type="button"
      class="btn-outline"
      [disabled]="isSubmitting()"
      (click)="close.emit()"
    >
      Cancelar
    </button>

    <div class="footer-actions-right">
      @if (currentStep() > 1) {
        <button
          type="button"
          class="btn-outline"
          [disabled]="isSubmitting()"
          (click)="goToStep(currentStep() === 3 ? 2 : 1)"
        >
          <svg lucideChevronLeft class="btn-icon-left"></svg>
          <span>Anterior</span>
        </button>
      }

      @if (currentStep() < 3) {
        <button
          type="button"
          class="btn-primary"
          [disabled]="isSubmitting()"
          (click)="goToStep(currentStep() === 1 ? 2 : 3)"
        >
          <span>Siguiente Paso</span>
          <svg lucideChevronRight class="btn-icon-right"></svg>
        </button>
      } @else {
        <button
          type="button"
          class="btn-outline"
          [disabled]="isSubmitting()"
          (click)="submit(false)"
        >
          <span>{{ isSubmitting() ? 'Guardando...' : 'Guardar Borrador' }}</span>
        </button>

        <button
          type="button"
          class="btn-primary btn-publish-final"
          [disabled]="isSubmitting()"
          (click)="submit(true)"
        >
          <svg lucideCheck class="btn-icon-sm"></svg>
          <span>{{ isSubmitting() ? 'Publicando...' : 'Publicar Ahora' }}</span>
        </button>
      }
    </div>
  </div>
</modal-shell>

<!-- Modal Secundario de Fuzzing -->
@if (showFuzzingModal()) {
  <fuzzing-modal
    [exerciseId]="exerciseToEdit()?.id || 'new-fuzz'"
    [exerciseTitle]="title() || 'Laboratorio Nuevo'"
    (close)="showFuzzingModal.set(false)"
    (applied)="onFuzzCasesApplied($event)"
  />
}

<!-- Modal Secundario de Solicitud de Plantilla Docker -->
@if (showTemplateRequestModal()) {
  <template-request-modal
    (close)="closeTemplateRequestModal()"
    (requested)="onTemplateRequested()"
  />
}
