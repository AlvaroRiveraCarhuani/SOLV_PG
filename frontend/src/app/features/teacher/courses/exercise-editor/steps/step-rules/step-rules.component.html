<div class="step-rules-container">
  <!-- Restricciones AST (Semgrep) -->
  <div class="ast-rules-section">
    <div class="section-header">
      <label class="section-title">
        <svg lucideShield class="section-icon-shield"></svg>
        <span>Restricciones de Código AST (Semgrep)</span>
      </label>
      <p class="section-subtitle">
        Bloquea automáticamente atajos o APIs que anulen el objetivo pedagógico del ejercicio.
      </p>
    </div>

    <div class="rules-checkbox-list">
      <label class="rule-checkbox-card">
        <input
          type="checkbox"
          [checked]="blockNativeSort()"
          (change)="blockNativeSort.set($any($event.target).checked)"
        />
        <div class="rule-text">
          <span class="rule-name">Prohibir funciones nativas de ordenamiento</span>
          <span class="rule-code" machineData>Bloquea .sort(), sorted(), std::sort, qsort</span>
        </div>
      </label>

      <label class="rule-checkbox-card">
        <input
          type="checkbox"
          [checked]="blockSystemModules()"
          (change)="blockSystemModules.set($any($event.target).checked)"
        />
        <div class="rule-text">
          <span class="rule-name">Prohibir módulos del sistema y llamadas de red</span>
          <span class="rule-code" machineData>Bloquea import os, sys, subprocess, socket, fetch</span>
        </div>
      </label>

      <label class="rule-checkbox-card">
        <input
          type="checkbox"
          [checked]="forceRecursion()"
          (change)="forceRecursion.set($any($event.target).checked)"
        />
        <div class="rule-text">
          <span class="rule-name">Exigir implementación recursiva</span>
          <span class="rule-code" machineData>Valida llamada a la misma función en el cuerpo del AST</span>
        </div>
      </label>
    </div>
  </div>

  <!-- Boilerplate / Código Base Inicial -->
  <div class="boilerplate-section">
    <div class="section-header">
      <label class="section-title">
        <svg lucideCode class="section-icon-code"></svg>
        <span>Código Base Inicial (Boilerplate)</span>
      </label>
      <p class="section-subtitle">
        Estructura o firma de función precargada en el editor del estudiante al iniciar.
      </p>
    </div>

    <form-field label="Plantilla de Código" for="labBoilerplate">
      <textarea
        id="labBoilerplate"
        rows="8"
        placeholder="# Escribe la firma de la función o el código inicial para el alumno..."
        [ngModel]="boilerplate()"
        (ngModelChange)="boilerplate.set($event)"
        class="form-textarea font-mono code-input"
        spellcheck="false"
      ></textarea>
    </form-field>
  </div>
</div>
