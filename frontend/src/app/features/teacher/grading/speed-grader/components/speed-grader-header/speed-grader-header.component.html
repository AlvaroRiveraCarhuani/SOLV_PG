<header class="grader-header">
  <div class="header-left">
    <a [routerLink]="['/teacher/cursos', review().subject_id]" class="back-link">
      <svg lucideArrowLeft class="btn-icon-sm"></svg>
      <span>Volver al Curso</span>
    </a>
    <div class="exercise-info">
      <h1 class="page-title">{{ review().exercise_title }}</h1>
      <span class="subject-subtitle">{{ review().subject_name }}</span>
    </div>
  </div>

  <div class="header-nav">
    <button
      type="button"
      class="nav-arrow-btn"
      [disabled]="!review().prev_submission_id"
      [routerLink]="review().prev_submission_id ? ['/teacher/revision', review().prev_submission_id] : null"
      title="Entrega anterior (Atajo: K)"
      aria-label="Entrega anterior"
    >
      <svg lucideChevronLeft class="btn-icon-sm"></svg>
    </button>

    <div class="student-badge">
      <strong class="student-name">{{ review().student_name }}</strong>
      <span class="student-email">{{ review().student_email }}</span>
    </div>

    <button
      type="button"
      class="nav-arrow-btn"
      [disabled]="!review().next_submission_id"
      [routerLink]="review().next_submission_id ? ['/teacher/revision', review().next_submission_id] : null"
      title="Siguiente entrega (Atajo: J)"
      aria-label="Siguiente entrega"
    >
      <svg lucideChevronRight class="btn-icon-sm"></svg>
    </button>
  </div>

  <div class="header-actions">
    <!-- Re-ejecutar prueba rápida -->
    <button
      type="button"
      class="btn-outline"
      [disabled]="isRunningEphemeral()"
      (click)="runEphemeral.emit()"
      title="Ejecutar prueba rápida en contenedor"
    >
      @if (isRunningEphemeral()) {
        <svg lucideLoader2 class="btn-icon-sm spin-icon"></svg>
        <span>Ejecutando...</span>
      } @else {
        <svg lucidePlay class="btn-icon-sm"></svg>
        <span>Re-ejecutar</span>
      }
    </button>

    <!-- Menú Desplegable: Herramientas de Análisis -->
    <div class="tools-dropdown">
      <button
        type="button"
        class="btn-outline btn-tools-toggle"
        (click)="showToolsMenu.update(v => !v)"
        [class.active]="showReplayPlayer() || showBenchmark() || showDiffView()"
        title="Herramientas adicionales de inspección y auditoría"
      >
        <svg lucideSlidersHorizontal class="btn-icon-sm"></svg>
        <span>Herramientas</span>
        <svg lucideChevronDown class="btn-icon-xs"></svg>
      </button>

      @if (showToolsMenu()) {
        <div class="dropdown-menu animate-fade">
          <button
            type="button"
            class="dropdown-item"
            [class.active]="showDiffView()"
            (click)="toggleDiff.emit(); showToolsMenu.set(false)"
            title="Comparar código con la plantilla base (Atajo: D)"
          >
            <svg lucideGitCompare class="btn-icon-sm"></svg>
            <span>{{ showDiffView() ? 'Ver Código Completo' : 'Comparar con Plantilla' }}</span>
            <kbd>D</kbd>
          </button>

          <button
            type="button"
            class="dropdown-item"
            [class.active]="showReplayPlayer()"
            (click)="toggleReplay.emit(); showToolsMenu.set(false)"
            title="Ver evolución temporal paso a paso (Atajo: T)"
          >
            <svg lucideHistory class="btn-icon-sm"></svg>
            <span>Evolución Temporal del Código</span>
            <kbd>T</kbd>
          </button>

          <button
            type="button"
            class="dropdown-item"
            (click)="openKeystrokeReplay.emit(); showToolsMenu.set(false)"
            title="Abrir auditoría forense de tipeo y pegados"
          >
            <svg lucideFilm class="btn-icon-sm"></svg>
            <span>Auditoría de Escritura (Replay)</span>
          </button>

          <button
            type="button"
            class="dropdown-item"
            [class.active]="showBenchmark()"
            (click)="toggleBenchmark.emit(); showToolsMenu.set(false)"
            title="Análisis de complejidad algorítmica (Atajo: B)"
          >
            <svg lucideTrendingUp class="btn-icon-sm"></svg>
            <span>Análisis de Complejidad Asintótica</span>
            <kbd>B</kbd>
          </button>

          <button
            type="button"
            class="dropdown-item"
            (click)="openShadowTerminal.emit(); showToolsMenu.set(false)"
            title="Abrir consola de supervisión en vivo del alumno"
          >
            <svg lucideTerminal class="btn-icon-sm"></svg>
            <span>Consola del Estudiante</span>
          </button>
        </div>
      }
    </div>

    <!-- Botón Primario: Calificar -->
    <button type="button" class="btn-primary" (click)="openOverrideModal.emit()" title="Ajustar calificación o veredicto (Atajo: A)">
      <svg lucideEdit3 class="btn-icon-sm"></svg>
      <span>Calificar</span>
      <kbd>A</kbd>
    </button>

    <!-- Atajos de teclado -->
    <button type="button" class="btn-icon-only" (click)="openShortcutsGuide.emit()" title="Guía de Atajos de Teclado (?)">
      <svg lucideKeyboard class="btn-icon-sm"></svg>
    </button>
  </div>
</header>
