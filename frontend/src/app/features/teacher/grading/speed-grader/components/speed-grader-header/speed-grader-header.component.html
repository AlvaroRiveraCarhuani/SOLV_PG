<header class="grader-header">
  <div class="header-left">
    <a [routerLink]="['/teacher/cursos', review().subject_id]" class="back-link">
      <svg lucideArrowLeft class="btn-icon-sm"></svg>
      <span>Volver al Curso</span>
    </a>
    <div class="exercise-info">
      <h1 class="page-title">{{ review().exercise_title }}</h1>
      <span class="subject-subtitle">{{ review().subject_name }}</span>
    </div>
  </div>

  <div class="header-nav">
    <button
      class="nav-btn"
      [disabled]="!review().prev_submission_id"
      [routerLink]="review().prev_submission_id ? ['/teacher/revision', review().prev_submission_id] : null"
      title="Entrega anterior (K)"
    >
      <svg lucideChevronLeft class="btn-icon-sm"></svg>
      <span>Anterior <kbd>K</kbd></span>
    </button>

    <div class="student-badge">
      <strong>{{ review().student_name }}</strong>
      <span class="student-email">{{ review().student_email }}</span>
    </div>

    <button
      class="nav-btn"
      [disabled]="!review().next_submission_id"
      [routerLink]="review().next_submission_id ? ['/teacher/revision', review().next_submission_id] : null"
      title="Siguiente entrega (J)"
    >
      <span>Siguiente <kbd>J</kbd></span>
      <svg lucideChevronRight class="btn-icon-sm"></svg>
    </button>
  </div>

  <div class="header-actions">
    <button
      class="btn-outline"
      (click)="openKeystrokeReplay.emit()"
      title="Ver replay de escritura y auditoría forense de pegados"
    >
      <svg lucideFilm class="btn-icon-sm"></svg>
      <span>Replay de Escritura</span>
    </button>

    <button
      class="btn-outline btn-replay-toggle"
      [class.active]="showReplayPlayer()"
      (click)="toggleReplay.emit()"
      title="Time-Travel Replay de Escritura (T)"
    >
      <svg lucideHistory class="btn-icon-sm"></svg>
      <span>Time-Travel Replay <kbd>T</kbd></span>
    </button>

    <button
      class="btn-outline"
      [class.active]="showBenchmark()"
      (click)="toggleBenchmark.emit()"
      title="Benchmark de Complejidad Asintótica O(N) (B)"
    >
      <svg lucideTrendingUp class="btn-icon-sm"></svg>
      <span>Benchmark O(N) <kbd>B</kbd></span>
    </button>

    <button
      class="btn-outline"
      [class.active]="showDiffView()"
      (click)="toggleDiff.emit()"
      title="Alternar comparación de código (D)"
    >
      <svg lucideGitCompare class="btn-icon-sm"></svg>
      <span>{{ showDiffView() ? 'Código Completo' : 'Comparar con Código Inicial' }} <kbd>D</kbd></span>
    </button>

    <button
      class="btn-outline"
      [disabled]="isRunningEphemeral()"
      (click)="runEphemeral.emit()"
    >
      <svg lucidePlay class="btn-icon-sm"></svg>
      <span>{{ isRunningEphemeral() ? 'Ejecutando...' : 'Re-ejecutar Prueba' }}</span>
    </button>

    <button
      class="btn-outline"
      (click)="openShadowTerminal.emit()"
      title="Inspeccionar Terminal en Vivo (Shadow Mode)"
    >
      <svg lucideTerminal class="btn-icon-sm"></svg>
      <span>Terminal (Shadow)</span>
    </button>

    <button class="btn-primary" (click)="openOverrideModal.emit()" title="Modificar Nota (A)">
      <svg lucideEdit3 class="btn-icon-sm"></svg>
      <span>Calificar <kbd>A</kbd></span>
    </button>

    <button class="btn-icon-only" (click)="openShortcutsGuide.emit()" title="Guía de Atajos de Teclado (?)">
      <svg lucideKeyboard class="btn-icon-sm"></svg>
    </button>
  </div>
</header>
