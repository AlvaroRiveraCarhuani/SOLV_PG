<div class="speed-grader-container">
  @if (isLoading()) {
    <skeleton-loader variant="code" [count]="12" />
  } @else if (review(); as r) {
    <speed-grader-header
      [review]="r"
      [mode]="reviewMode()"
      [showReplayPlayer]="showReplayPlayer()"
      [showDiffView]="showDiffView()"
      [diffAvailable]="canShowDiff()"
      [isRunningEphemeral]="isRunningEphemeral()"
      (openKeystrokeReplay)="openKeystrokeReplay()"
      (toggleReplay)="toggleReplay()"
      (runEphemeral)="runEphemeralSandbox()"
      (openOverrideModal)="openOverrideModal()"
      (openShortcutsGuide)="openShortcutsGuide()"
      (toggleDiff)="toggleDiffView()"
    />
    <div
      class="grader-body"
      [class.grader-body-project]="isProject()"
      [class.grader-body-tree]="showFileTree() && !treeCollapsed()"
      [class.grader-body-tree-collapsed]="showFileTree() && treeCollapsed()"
    >
      @if (showFileTree()) {
        @if (treeCollapsed()) {
          <button
            type="button"
            class="tree-rail"
            (click)="treeCollapsed.set(false)"
            title="Mostrar el árbol de archivos"
            aria-label="Mostrar el árbol de archivos"
          >
            <svg lucidePanelLeftOpen class="btn-icon-sm"></svg>
          </button>
        } @else {
          <review-file-tree
            class="file-tree"
            [files]="files()"
            [selectedPath]="selectedFilePath()"
            (fileSelected)="selectFile($event)"
            (collapse)="treeCollapsed.set(true)"
          />
        }
      }

      <speed-grader-code-viewer
        [review]="r"
        [activeFile]="isProject() ? activeFile() : null"
        [fileComments]="isProject() ? activeFileComments() : []"
        [generalComments]="isProject() ? generalComments() : []"
        [flatSnapshot]="isProject() && !showFileTree()"
        [showDiffView]="showDiffView()"
        [showReplayPlayer]="showReplayPlayer()"
        [timeline]="timeline()"
        [selectedLineNumber]="selectedLineNumber()"
        [selectedLineEndNumber]="selectedLineEndNumber()"
        [newCommentText]="newCommentText()"
        [isAddingComment]="isAddingComment()"
        [codeLines]="codeLines()"
        [commentsByLine]="commentsByLine()"
        [starterBoilerplate]="starterBoilerplate()"
        [diffOriginal]="diffOriginal()"
        [diffModified]="diffModified()"
        [diffLanguage]="diffLanguage()"
        (lineSelected)="selectLine($event)"
        (lineRangeSelected)="selectLineRange($event)"
        (commentSubmitted)="submitComment($event)"
        (newCommentTextChange)="newCommentText.set($event)"
        (toggleDiff)="toggleDiffView()"
        (toggleReplay)="toggleReplay()"
      />
      <speed-grader-eval-panel
        [mode]="reviewMode()"
        [rubric]="rubric()"
        [rubricSuccessMessage]="rubricSuccessMessage()"
        [rubricErrorMessage]="rubricErrorMessage()"
        [isSubmittingRubric]="isSubmittingRubric()"
        [calculatedRubricScore]="calculatedRubricScore()"
        [review]="r"
        [ephemeralResult]="ephemeralResult()"
        [getComplexityClass]="getComplexityClass"
        [selections]="selections()"
        [rubricComments]="rubricComments()"
        [copiedIndex]="copiedIndex()"
        (levelSelected)="onLevelSelected($event.criterionId, $event.levelName)"
        (rubricCommentsChange)="rubricComments.set($event)"
        (saveRubricEvaluation)="saveRubricEvaluation()"
        (copyCaseInput)="copyCaseInput($event.input, $event.index)"
      />
    </div>
  }
</div>

@if (showOverrideModal()) {
  <speed-grader-override-modal
    [overrideVerdict]="overrideVerdict()"
    [overrideScore]="overrideScore()"
    [overrideReason]="overrideReason()"
    [notifyStudent]="overrideNotifyStudent()"
    [overrideError]="overrideError()"
    [isSubmittingOverride]="isSubmittingOverride()"
    [verdictOptions]="verdictOptions"
    (dismiss)="closeOverrideModal()"
    (verdictChange)="overrideVerdict.set($event)"
    (scoreChange)="overrideScore.set($event)"
    (reasonChange)="overrideReason.set($event)"
    (notifyStudentChange)="overrideNotifyStudent.set($event)"
    (submitOverride)="submitOverride()"
  />
}

@if (showKeystrokeReplay()) {
  <keystroke-replay-modal
    [submissionId]="submissionId()"
    (closed)="closeKeystrokeReplay()"
  />
}
