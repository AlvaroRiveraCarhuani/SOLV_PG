<div class="student-course">
  <header class="course-header">
    <a routerLink="/student/courses" class="back-link">
      <svg lucideArrowLeft class="back-icon" aria-hidden="true"></svg>
      <span>Mis materias</span>
    </a>

    <div class="course-heading">
      <div class="course-heading-text">
        <div class="course-title-row">
          <h1 class="page-title">{{ subjectName() }}</h1>
          @if (subjectCode()) {
            <span class="subject-code-badge" machineData>{{ subjectCode() }}</span>
          }
        </div>

        <p class="page-subtitle">
          @if (totalExercises() > 0) {
            <span machineData>{{ completedExercises() }}</span> de
            <span machineData>{{ totalExercises() }}</span> prácticas completadas
            <span class="subtitle-separator" aria-hidden="true">·</span>
            <span machineData>{{ progressPercent() }}%</span> del curso
          } @else {
            Esta materia todavía no tiene prácticas publicadas.
          }
        </p>
      </div>

      <button type="button" class="btn-outline btn-refresh refresh-button" (click)="refresh()">
        <svg lucideRefreshCw class="refresh-icon" aria-hidden="true"></svg>
        <span>Actualizar</span>
      </button>
    </div>
  </header>

  <div class="course-layout-grid">
    <main class="course-main-content">
      <curricular-map [courseId]="effectiveCourseId()" [refreshTick]="refreshTick()"></curricular-map>
    </main>

    <aside class="course-sidebar">
      <recommendations-panel [courseId]="effectiveCourseId()"></recommendations-panel>
    </aside>
  </div>
</div>
