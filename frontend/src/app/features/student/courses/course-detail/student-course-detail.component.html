<div class="student-course-container">
  <!-- Header / Breadcrumb -->
  <header class="course-header">
    <a routerLink="/student" class="back-link">
      <svg lucideArrowLeft class="back-icon"></svg>
      <span>Volver al panel</span>
    </a>
    <div class="course-title-section">
      <div class="title-with-code">
        <h1 class="course-title">{{ subjectName() }}</h1>
        @if (subjectCode()) {
          <span class="subject-code-badge" machineData>{{ subjectCode() }}</span>
        }
      </div>
      <p class="course-subtitle">Panel académico del estudiante y asignaciones</p>
    </div>
  </header>

  <!-- Layout de dos columnas -->
  <div class="course-layout-grid">
    <!-- Columna principal: asignaciones y mapa curricular -->
    <main class="course-main-content">
      <!-- Mapa Curricular del Curso -->
      <section class="content-card curricular-map-section">
        <curricular-map [courseId]="effectiveCourseId()"></curricular-map>
      </section>
    </main>

    <!-- Columna lateral: Panel de recomendaciones de refuerzo -->
    <aside class="course-sidebar">
      <recommendations-panel [courseId]="effectiveCourseId()"></recommendations-panel>
    </aside>
  </div>
</div>
