<modal-shell
  title="Invitar Nuevo Docente"
  subtitle="Emisión de token transaccional de un solo uso con vigencia de 72 horas."
  (close)="close.emit()"
>
  <svg modal-icon lucideUserPlus class="icon"></svg>

  <form-field
    label="Correo Institucional del Docente"
    for="teacher-email"
    [required]="true"
    [hint]="isExternalDomain() ? '' : 'El profesor completará su alta mediante Google Workspace SSO con esta cuenta institucional.'"
  >
    <div class="input-with-icon">
      <svg lucideMail class="field-icon"></svg>
      <input
        id="teacher-email"
        type="email"
        [placeholder]="institutionDomain() ? ('profesor@' + institutionDomain()) : 'profesor@institucion.edu'"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
        class="form-input with-icon"
        autofocus
        autocomplete="email"
      />
    </div>

    @if (isExternalDomain()) {
      <div class="domain-warning-box">
        <svg lucideAlertTriangle class="warning-icon"></svg>
        <div class="warning-content">
          <span class="warning-title">Dominio externo detectado ({{ enteredDomain() }})</span>
          <p class="warning-text">
            El correo no coincide con el dominio oficial ({{ institutionDomain() }}). Si la institución restringe el acceso con Google Workspace institucional, el docente no podrá completar su registro.
          </p>
        </div>
      </div>
    }
  </form-field>

  <div class="checkbox-group">
    <label class="checkbox-label">
      <input
        type="checkbox"
        [checked]="sendEmail()"
        (change)="sendEmail.set(!sendEmail())"
      />
      <span class="checkbox-text">
        Enviar enlace de acceso directo por correo electrónico (Token expira en 72 horas)
      </span>
    </label>
  </div>

  <ng-container modal-footer>
    <button class="btn-outline" (click)="close.emit()">
      <span>Cancelar</span>
    </button>
    <button
      class="btn-primary"
      [disabled]="!isValidEmail() || isSubmitting()"
      (click)="onSubmit()"
    >
      @if (isSubmitting()) {
        <div class="tenant-spinner-sm"></div>
        <span>Generando...</span>
      } @else {
        <svg lucideShieldCheck class="btn-icon"></svg>
        <span>Generar Token e Invitar</span>
      }
    </button>
  </ng-container>
</modal-shell>
