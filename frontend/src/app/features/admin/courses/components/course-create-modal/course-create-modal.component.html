<modal-shell
  title="Nuevo Curso Institucional"
  subtitle="Alta de materia oficial y asignación de titular docente."
  (close)="close.emit()"
>
  <svg modal-icon lucideBookPlus class="header-icon"></svg>

  @if (formError()) {
    <div class="error-banner">
      <svg lucideAlertCircle class="error-icon"></svg>
      <span>{{ formError() }}</span>
    </div>
  }

  <div class="form-row">
    <form-field class="flex-2" label="Nombre de la Materia" for="courseName" [required]="true">
      <input
        id="courseName"
        type="text"
        placeholder="ej. Sistemas Operativos II"
        [ngModel]="name()"
        (ngModelChange)="name.set($event)"
        class="form-input"
      />
    </form-field>

    <form-field class="flex-1" label="Código Oficial" for="courseCode" [required]="true">
      <input
        id="courseCode"
        type="text"
        placeholder="ej. SIS-311"
        [ngModel]="code()"
        (ngModelChange)="code.set($event)"
        class="form-input uppercase"
      />
    </form-field>
  </div>

  <form-field label="Periodo Académico (Semestre)">
    <combobox
      [value]="selectedPeriodLabel()"
      [options]="periodComboboxOptions()"
      placeholder="Seleccione o busque un periodo académico..."
      (optionSelected)="onPeriodSelected($event)"
    ></combobox>
  </form-field>

  <form-field label="Docente Titular Asignado">
    <combobox
      [value]="selectedTeacherLabel()"
      [options]="teacherComboboxOptions()"
      placeholder="Seleccione o busque docente titular..."
      (optionSelected)="onTeacherSelected($event)"
    ></combobox>
  </form-field>

  <form-field label="Plantilla Docker Base">
    <combobox
      [value]="selectedTemplateLabel()"
      [options]="templateComboboxOptions()"
      placeholder="Seleccione o busque plantilla Docker base..."
      (optionSelected)="onTemplateSelected($event)"
    ></combobox>
  </form-field>

  <form-field label="Color de Identificación">
    <course-color-picker
      [selectedColor]="selectedColor()"
      (colorChange)="selectedColor.set($event)"
    ></course-color-picker>
  </form-field>

  <ng-container modal-footer>
    <button class="btn-outline" (click)="close.emit()" [disabled]="isSubmitting()">
      Cancelar
    </button>
    <button class="btn-primary" (click)="submitCourse()" [disabled]="isSubmitting()">
      <span>{{ isSubmitting() ? 'Creando curso...' : 'Crear Curso' }}</span>
    </button>
  </ng-container>
</modal-shell>
