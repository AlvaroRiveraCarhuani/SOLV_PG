<modal-shell
  title="Reasignar Docente a la Materia"
  subtitle="Transferencia de materia con registro en auditoría institucional."
  (close)="close.emit()"
>
  <svg modal-icon lucideArrowRightLeft class="icon"></svg>

  @if (formError()) {
    <div class="error-banner">
      <svg lucideAlertCircle class="error-icon"></svg>
      <span>{{ formError() }}</span>
    </div>
  }

  <div class="context-box">
    <div class="context-item">
      <span class="context-label">Materia:</span>
      <span class="context-value highlight">{{ course.code }} — {{ course.name }}</span>
    </div>
    <div class="context-item">
      <span class="context-label">Docente Actual:</span>
      <span class="context-value">{{ course.teacher_name }}</span>
    </div>
  </div>

  <form-field label="Nuevo Docente Asignado" [required]="true">
    <combobox
      [value]="selectedTeacherLabel()"
      [options]="teacherComboboxOptions()"
      placeholder="Seleccione o busque nuevo docente..."
      (optionSelected)="onTeacherSelected($event)"
    ></combobox>
  </form-field>

  <form-field
    label="Motivo del Cambio"
    for="reassignReason"
    [required]="true"
    hint="Este motivo quedará asentado en el historial de eventos institucionales."
  >
    <div class="input-with-icon textarea-wrapper">
      <svg lucideFileText class="field-icon textarea-icon"></svg>
      <textarea
        id="reassignReason"
        rows="3"
        placeholder="Ingrese la justificación para el registro de auditoría (ej. Licencia médica, reorganización de departamentos)..."
        [ngModel]="reason()"
        (ngModelChange)="reason.set($event)"
        class="form-textarea with-icon">
      </textarea>
    </div>
  </form-field>

  <ng-container modal-footer>
    <button class="btn-outline" (click)="close.emit()" [disabled]="isSubmitting()">
      Cancelar
    </button>
    <button class="btn-primary" (click)="submitReassign()" [disabled]="isSubmitting()">
      <span>{{ isSubmitting() ? 'Reasignando...' : 'Confirmar Reasignación' }}</span>
    </button>
  </ng-container>
</modal-shell>
