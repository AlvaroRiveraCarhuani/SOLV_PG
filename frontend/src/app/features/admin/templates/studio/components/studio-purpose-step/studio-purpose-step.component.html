<section class="purpose-step">
  <div class="modality-grid" role="radiogroup" aria-label="Modalidad del entorno">
    <button
      type="button"
      class="modality"
      role="radio"
      [class.is-selected]="targetEnvironment() === 'IDE_PERSISTENTE'"
      [attr.aria-checked]="targetEnvironment() === 'IDE_PERSISTENTE'"
      (click)="selectModality('IDE_PERSISTENTE')"
    >
      <span class="modality-check" aria-hidden="true">
        <svg lucideCheck class="check-icon"></svg>
      </span>
      <span class="modality-top">
        <span class="modality-ico" aria-hidden="true">
          <svg lucideCode class="modality-icon"></svg>
        </span>
        <span class="modality-name">{{ 'IDE_PERSISTENTE' | environmentLabel }}</span>
      </span>
      <span class="modality-desc">Editor, terminal y carpetas persistentes para el trabajo del alumno.</span>
    </button>

    <button
      type="button"
      class="modality"
      role="radio"
      [class.is-selected]="targetEnvironment() === 'JUEZ_EFIMERO'"
      [attr.aria-checked]="targetEnvironment() === 'JUEZ_EFIMERO'"
      (click)="selectModality('JUEZ_EFIMERO')"
    >
      <span class="modality-check" aria-hidden="true">
        <svg lucideCheck class="check-icon"></svg>
      </span>
      <span class="modality-top">
        <span class="modality-ico" aria-hidden="true">
          <svg lucideTerminal class="modality-icon"></svg>
        </span>
        <span class="modality-name">{{ 'JUEZ_EFIMERO' | environmentLabel }}</span>
      </span>
      <span class="modality-desc">Corrección automática por consola, sin interfaz web.</span>
    </button>

    <button
      type="button"
      class="modality"
      role="radio"
      [class.is-selected]="targetEnvironment() === 'AMBOS'"
      [attr.aria-checked]="targetEnvironment() === 'AMBOS'"
      (click)="selectModality('AMBOS')"
    >
      <span class="modality-check" aria-hidden="true">
        <svg lucideCheck class="check-icon"></svg>
      </span>
      <span class="modality-top">
        <span class="modality-ico" aria-hidden="true">
          <svg lucideLayers class="modality-icon"></svg>
        </span>
        <span class="modality-name">Modo dual</span>
      </span>
      <span class="modality-desc">Desarrollo y corrección automática sobre la misma plantilla.</span>
    </button>
  </div>

  <div class="form-grid">
    <div class="field is-wide">
      <label class="form-label" for="studio-tpl-name">
        Nombre del entorno <span class="req" aria-hidden="true">*</span>
      </label>
      <input
        id="studio-tpl-name"
        type="text"
        class="form-input"
        placeholder="Nombre visible en el catálogo"
        [ngModel]="name()"
        (ngModelChange)="nameChange.emit($event)"
      />
      <span class="field-hint">Mínimo 3 caracteres. Se sugiere a partir de las tecnologías mientras no lo edite.</span>
    </div>

    <div class="field">
      <div class="field-label">
        <label class="form-label" for="studio-tpl-category">Categoría académica</label>
        <span class="optional">Opcional</span>
      </div>
      <combobox
        id="studio-tpl-category"
        [options]="categoryOptions()"
        [value]="selectedCategoryId() || ''"
        placeholder="Seleccione una categoría..."
        [showSearchIcon]="false"
        [showHeader]="false"
        [allowClear]="true"
        (valueChange)="categoryChange.emit($event || null)"
        (cleared)="categoryChange.emit(null)"
      />
      <span class="field-hint">Ordene el catálogo; no bloquea la publicación.</span>
    </div>

    <div class="field">
      <div class="field-label">
        <label class="form-label" for="studio-tpl-desc">Descripción pedagógica</label>
        <span class="optional">Opcional</span>
      </div>
      <input
        id="studio-tpl-desc"
        type="text"
        class="form-input"
        placeholder="Qué incluye el entorno y para qué sirve."
        [ngModel]="description()"
        (ngModelChange)="descriptionChange.emit($event)"
      />
    </div>
  </div>
</section>
