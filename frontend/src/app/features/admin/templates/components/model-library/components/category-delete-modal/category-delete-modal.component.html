<modal-shell
  title="Eliminar Categoría"
  subtitle="Esta acción no se puede deshacer"
  intent="error"
  (close)="onCancel()"
>
  <svg modal-icon lucideAlertTriangle class="icon"></svg>

  @if (errorMessage()) {
    <div class="field-error-alert">
      <svg lucideAlertTriangle class="alert-icon"></svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <p class="delete-warning-text">
    ¿Está seguro de eliminar la categoría <strong>"{{ category.name }}"</strong>?
  </p>
  <p class="delete-hint-text">
    No se podrá eliminar si tiene modelos o plantillas asociadas.
  </p>

  <ng-container modal-footer>
    <button type="button" class="btn-outline" (click)="onCancel()" [disabled]="isSubmitting()">
      Cancelar
    </button>
    <button
      type="button"
      class="btn-danger"
      (click)="onConfirm()"
      [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <span>Eliminando...</span>
      } @else {
        <span>Eliminar Categoría</span>
      }
    </button>
  </ng-container>
</modal-shell>
