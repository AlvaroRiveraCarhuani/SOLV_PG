<modal-shell
  title="Nuevo Modelo Oficial (Receta)"
  subtitle="Promocione una plantilla aprobada para convertirla en arquetipo base del catálogo"
  intent="info"
  (close)="onClose()"
>
  <svg modal-icon lucideSparkles class="icon"></svg>

  @if (errorMessage()) {
    <div class="field-error-alert">
      <svg lucideAlertTriangle class="alert-icon"></svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form-field
    label="Plantilla Aprobada Base"
    [required]="true"
    hint="Solo plantillas aprobadas que han superado la prueba de arranque y auditoría pueden ser promovidas."
  >
    <combobox
      [value]="selectedTemplateLabel()"
      [options]="templateOptions()"
      placeholder="Seleccione o busque una plantilla aprobada..."
      (optionSelected)="onTemplateSelected($event)"
    ></combobox>
  </form-field>

  <form-field label="Título del Modelo Institucional" [required]="true">
    <input
      type="text"
      class="form-input"
      placeholder="Ej: Python 3.12 Data Science Base"
      [ngModel]="modelTitle()"
      (ngModelChange)="modelTitle.set($event)"
    />
  </form-field>

  <form-field label="Categoría Académica" [required]="true">
    <combobox
      [value]="selectedCategoryLabel()"
      [options]="categoryOptions()"
      placeholder="Seleccione o busque categoría..."
      (optionSelected)="onCategorySelected($event)"
    ></combobox>
  </form-field>

  <form-field label="Descripción del Modelo">
    <textarea
      class="form-textarea"
      rows="3"
      placeholder="Describa el objetivo pedagógico y tecnologías incluidas..."
      [ngModel]="modelDescription()"
      (ngModelChange)="modelDescription.set($event)">
    </textarea>
  </form-field>

  <div class="wizard-callout-box">
    <div class="callout-content">
      <strong>¿Necesita diseñar un entorno nuevo desde cero?</strong>
      <p>Puede crear y auditar una nueva plantilla oficial en el wizard de plantillas.</p>
    </div>
    <button type="button" class="btn-outline" (click)="onOpenWizard()">
      <span>Crear plantilla</span>
    </button>
  </div>

  <ng-container modal-footer>
    <button type="button" class="btn-outline" (click)="onClose()" [disabled]="isSubmitting()">
      Cancelar
    </button>
    <button
      type="button"
      class="btn-primary"
      (click)="onConfirm()"
      [disabled]="isSubmitting() || !selectedTemplateId() || !modelTitle().trim()">
      @if (isSubmitting()) {
        <span>Guardando...</span>
      } @else {
        <span>Convertir en Modelo Oficial</span>
      }
    </button>
  </ng-container>
</modal-shell>
