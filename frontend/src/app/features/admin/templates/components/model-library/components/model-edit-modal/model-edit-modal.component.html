<div class="modal-backdrop" (click)="onClose()">
  <div class="modal-card modal-md" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3 class="modal-title">Editar Modelo Oficial</h3>
      <button type="button" class="btn-icon-close" (click)="onClose()" aria-label="Cerrar modal">
        <svg lucideX class="w-4 h-4"></svg>
      </button>
    </div>

    <div class="modal-body">
      @if (errorMessage()) {
        <div class="field-error-alert mb-3">
          <svg lucideAlertTriangle class="w-4 h-4"></svg>
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <div class="form-group mb-3">
        <label class="form-label font-semibold">Título del Modelo: <span class="text-danger">*</span></label>
        <input 
          type="text" 
          class="form-control" 
          [ngModel]="title()" 
          (ngModelChange)="title.set($event)"
        />
      </div>

      <div class="form-group mb-3">
        <label class="form-label font-semibold">Categoría Académica: <span class="text-danger">*</span></label>
        <combobox
          [value]="selectedCategoryLabel()"
          [options]="categoryOptions()"
          placeholder="Seleccione o busque categoría..."
          (optionSelected)="onCategorySelected($event)"
        ></combobox>
      </div>

      <div class="form-group">
        <label class="form-label font-semibold">Descripción Pedagógica:</label>
        <textarea 
          class="form-control text-area-sm" 
          rows="3" 
          [ngModel]="description()" 
          (ngModelChange)="description.set($event)">
        </textarea>
      </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="onClose()" [disabled]="isSubmitting()">
        Cancelar
      </button>
      <button 
        type="button" 
        class="btn btn-primary" 
        (click)="onSave()" 
        [disabled]="isSubmitting() || !title().trim() || !categoryId()">
        @if (isSubmitting()) {
          <span>Guardando...</span>
        } @else {
          <span>Guardar Cambios</span>
        }
      </button>
    </div>
  </div>
</div>
