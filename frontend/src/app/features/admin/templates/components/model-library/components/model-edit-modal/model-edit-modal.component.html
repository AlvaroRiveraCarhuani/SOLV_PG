<modal-shell
  title="Editar Modelo Oficial"
  subtitle="Actualización de datos del modelo del catálogo"
  (close)="onClose()"
>
  <svg modal-icon lucidePencil class="icon"></svg>

  @if (errorMessage()) {
    <div class="field-error-alert">
      <svg lucideAlertTriangle class="alert-icon"></svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form-field label="Título del Modelo" [required]="true">
    <input
      type="text"
      class="form-input"
      [ngModel]="title()"
      (ngModelChange)="title.set($event)"
    />
  </form-field>

  <form-field label="Categoría Académica" [required]="true">
    <combobox
      [value]="selectedCategoryLabel()"
      [options]="categoryOptions()"
      placeholder="Seleccione o busque categoría..."
      (optionSelected)="onCategorySelected($event)"
    ></combobox>
  </form-field>

  <form-field label="Descripción Pedagógica">
    <textarea
      class="form-textarea"
      rows="3"
      [ngModel]="description()"
      (ngModelChange)="description.set($event)">
    </textarea>
  </form-field>

  <ng-container modal-footer>
    <button type="button" class="btn-outline" (click)="onClose()" [disabled]="isSubmitting()">
      Cancelar
    </button>
    <button
      type="button"
      class="btn-primary"
      (click)="onSave()"
      [disabled]="isSubmitting() || !title().trim() || !categoryId()">
      @if (isSubmitting()) {
        <span>Guardando...</span>
      } @else {
        <span>Guardar Cambios</span>
      }
    </button>
  </ng-container>
</modal-shell>
