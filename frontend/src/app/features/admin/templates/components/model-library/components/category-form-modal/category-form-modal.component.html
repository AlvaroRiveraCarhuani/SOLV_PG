<modal-shell
  [title]="category ? 'Editar Categoría' : 'Nueva Categoría Académica'"
  (close)="onClose()"
>
  <svg modal-icon lucideTag class="icon"></svg>

  @if (errorMessage()) {
    <div class="field-error-alert">
      <svg lucideAlertTriangle class="alert-icon"></svg>
      <span>{{ errorMessage() }}</span>
    </div>
  }

  <form-field label="Nombre de la Categoría" for="category-name" [required]="true">
    <input
      id="category-name"
      type="text"
      class="form-input"
      placeholder="Ej: Inteligencia Artificial y Machine Learning"
      [ngModel]="name()"
      (ngModelChange)="name.set($event)"
    />
  </form-field>

  <form-field label="Descripción (Opcional)" for="category-description">
    <textarea
      id="category-description"
      class="form-textarea"
      rows="3"
      placeholder="Descripción del área temática o materias de aplicación..."
      [ngModel]="description()"
      (ngModelChange)="description.set($event)">
    </textarea>
  </form-field>

  <ng-container modal-footer>
    <button type="button" class="btn-outline" (click)="onClose()" [disabled]="isSubmitting()">
      Cancelar
    </button>
    <button
      type="button"
      class="btn-primary"
      (click)="onSave()"
      [disabled]="isSubmitting() || !name().trim()">
      @if (isSubmitting()) {
        <span>Guardando...</span>
      } @else {
        <span>{{ category ? 'Actualizar Categoría' : 'Crear Categoría' }}</span>
      }
    </button>
  </ng-container>
</modal-shell>
