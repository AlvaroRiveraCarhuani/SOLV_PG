<modal-shell
  title="Promover a modelo de plantilla"
  subtitle="Convierte esta plantilla aprobada en una receta base para nuevos entornos"
  intent="warning"
  (close)="closeModal()"
>
  <svg modal-icon lucideSparkles class="icon"></svg>

  @if (errorMsg()) {
    <div class="field-error-alert">
      <svg lucideAlertCircle class="alert-icon"></svg>
      <span>{{ errorMsg() }}</span>
    </div>
  }

  <form-field label="Nombre del Modelo">
    <input
      type="text"
      class="form-input"
      [ngModel]="modelName()"
      (ngModelChange)="modelName.set($event)"
    />
  </form-field>

  <form-field label="Categoría Académica" [required]="true">
    <select
      class="form-select"
      required
      [ngModel]="categoryId()"
      (ngModelChange)="categoryId.set($event)"
    >
      <option [ngValue]="null" disabled>Seleccione una categoría...</option>
      @for (cat of categories(); track cat.id) {
        <option [value]="cat.id">{{ cat.name }}</option>
      }
    </select>
  </form-field>

  <form-field label="Descripción del Modelo (Opcional)">
    <textarea
      class="form-textarea"
      rows="3"
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"
    ></textarea>
  </form-field>

  <ng-container modal-footer>
    <button type="button" class="btn-outline" (click)="closeModal()" [disabled]="isPromoting()">
      Cancelar
    </button>
    <button
      type="button"
      class="btn-primary"
      [disabled]="!modelName().trim() || !categoryId() || isPromoting()"
      (click)="confirm()"
    >
      <span>Promover a Modelo</span>
    </button>
  </ng-container>
</modal-shell>
