<modal-shell
  title="Ajustar Cuota de Plantilla Oficial"
  subtitle="Modificación de asignación de RAM y parámetros pedagógicos"
  (close)="closeModal()"
>
  <svg modal-icon lucideLayers class="icon"></svg>

  <div class="template-summary-card">
    <div class="summary-row">
      <span class="summary-label">Plantilla:</span>
          <span class="summary-value">{{ template.name }}</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">Imagen Docker:</span>
      <code class="docker-image-tag">{{ template.docker_image }}</code>
    </div>
  </div>

  <div class="quota-section">
    <label class="quota-title">
      <svg lucideHardDrive class="quota-icon"></svg>
      <span>Asignación de Memoria RAM:</span>
    </label>
    <div class="chips-selector">
      <button
        type="button"
        class="chip-btn"
        [class.active]="selectedRam() === 256"
        (click)="setRam(256)">
        256 MB <span class="chip-desc">Ligera</span>
      </button>
      <button
        type="button"
        class="chip-btn"
        [class.active]="selectedRam() === 512"
        (click)="setRam(512)">
        512 MB <span class="chip-desc chip-badge">Sugerido</span>
      </button>
      <button
        type="button"
        class="chip-btn"
        [class.active]="selectedRam() === 1024"
        (click)="setRam(1024)">
        1024 MB <span class="chip-desc">Intensiva</span>
      </button>
    </div>
  </div>

  <form-field label="Descripción / Justificación Técnica">
    <textarea
      class="form-textarea"
      rows="3"
      placeholder="Descripción actualizada para docentes y alumnos..."
      [ngModel]="description()"
      (ngModelChange)="description.set($event)"></textarea>
  </form-field>

  <ng-container modal-footer>
    <button type="button" class="btn-outline" (click)="closeModal()" [disabled]="isSubmitting()">
      Cancelar
    </button>
    <button
      type="button"
      class="btn-primary"
      (click)="confirmSave()"
      [disabled]="isSubmitting()">
      @if (isSubmitting()) {
        <span>Guardando...</span>
      } @else {
        <svg lucideSave class="btn-icon"></svg>
        <span>Guardar Cambios</span>
      }
    </button>
  </ng-container>
</modal-shell>
