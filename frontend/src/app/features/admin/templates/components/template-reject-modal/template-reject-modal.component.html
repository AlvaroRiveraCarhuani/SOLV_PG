<modal-shell
  title="Rechazar Solicitud de Plantilla"
  subtitle="Indique la retroalimentación técnica para el docente solicitante"
  intent="error"
  (close)="closeModal()"
>
  <svg modal-icon lucideAlertTriangle class="icon"></svg>

  <div class="template-summary-card">
    <div class="summary-row">
      <span class="summary-label">Plantilla:</span>
      <span class="summary-value">{{ template.name }}</span>
    </div>
    <div class="summary-row">
      <span class="summary-label">Imagen solicitada:</span>
      <code class="docker-image-tag">{{ template.docker_image }}</code>
    </div>
    @if (template.requested_by_name) {
      <div class="summary-row">
        <span class="summary-label">Docente:</span>
        <span class="summary-value secondary">{{ template.requested_by_name }}</span>
      </div>
    }
  </div>

  <form-field
    label="Motivo de Rechazo (Obligatorio, visible para el docente)"
    [error]="!isValid() && charCount() > 0 ? 'Debe ingresar al menos 10 caracteres para fundamentar técnicamente el rechazo.' : ''"
    hint="Este mensaje será visible para el docente en su bandeja de solicitudes."
  >
    <textarea
      class="form-textarea"
      rows="4"
      placeholder="Ejemplo: La imagen solicitada excede los límites de peso en disco o posee vulnerabilidades no mitigadas. Por favor solicitar una variante slim o alpine..."
      [ngModel]="rejectionReason()"
      (ngModelChange)="rejectionReason.set($event)"></textarea>
  </form-field>
  <div class="counter-row">
    <span class="char-counter" [class.ok]="isValid()" [class.low]="!isValid() && charCount() > 0">
      {{ charCount() }} / 10 caracteres mínimos
    </span>
  </div>

  <ng-container modal-footer>
    <button type="button" class="btn-outline" (click)="closeModal()" [disabled]="isSubmitting()">
      Cancelar
    </button>
    <button
      type="button"
      class="btn-danger"
      (click)="confirmReject()"
      [disabled]="!isValid() || isSubmitting()">
      @if (isSubmitting()) {
        <span>Rechazando...</span>
      } @else {
        <svg lucideXCircle class="btn-icon"></svg>
        <span>Confirmar Rechazo</span>
      }
    </button>
  </ng-container>
</modal-shell>
