<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Preparando tu entorno | SOLV</title>
    <style>
      :root {
        color-scheme: dark;
        --fondo: #0f172a;
        --panel: #16213a;
        --texto: #e7edf7;
        --tenue: #93a4bd;
        --acento: #4f9cf9;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--fondo);
        color: var(--texto);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        padding: 32px;
        text-align: center;
        max-width: 420px;
      }
      .rueda {
        width: 46px;
        height: 46px;
        border-radius: 50%;
        border: 3px solid rgba(147, 164, 189, 0.25);
        border-top-color: var(--acento);
        animation: girar 0.9s linear infinite;
      }
      h1 { margin: 0; font-size: 20px; font-weight: 600; }
      p { margin: 0; font-size: 14px; line-height: 1.55; color: var(--tenue); }
    .volver a {
      color: var(--acento);
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }
    .volver a:hover,
    .volver a:focus-visible { text-decoration: underline; }
      @keyframes girar { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        .rueda { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="rueda" id="rueda" role="progressbar" aria-label="Preparando el entorno"></div>
      <h1 id="titulo">Preparando tu entorno</h1>
      <p id="detalle">
        El editor se está iniciando. Esta pestaña te lleva sola en cuanto esté
        listo; si tarda, volvé a la pestaña anterior y elegí abrir el IDE otra vez.
      </p>
      <p class="volver" id="volver" hidden>
        <a id="volver-enlace" href="/student">Volver a la página del ejercicio</a>
      </p>
    </main>
    <script src="/entorno.js"></script>
  </body>
</html>
