schema: spec-driven

context: |
  Backend: Go 1.26 + net/http.ServeMux (no Gin) + sqlx + PostgreSQL; hexagonal (core/domain, core/services, infrastructure/, delivery/http); goose migrations.
  Frontend: Angular 22 standalone zoneless (Signals only, @if/@for/@switch, inject(), loadComponent); Material 3 + Lucide + SCSS tokens; selector prefix `app`, `solv-` banned; Tailwind banned.
  Testing: el plan de impacto de `tools/test-impact` selecciona suites y nivel; no se ejecutan runners completos por defecto. Backend `go test` por paquete, integración con `TEST_DB_DSN`, frontend specs seleccionadas (vitest + jsdom), build por lado y gates de estilo; la suite de seguridad ejecuta `go vet`, `npm audit` y auditoría de secretos, sin Semgrep en CI.
  Style: Conventional Commits with Que/Por que/Como/Impacto body; no emojis; ADRs tracked in docs/ARQUITECTURA/ADR/INDEX.md.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Flag ADR-INDEX and slice-traceability updates when architecture or DB changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document fit with hexagonal layers and D1-D6 constraints
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    guidelines:
      - Follow existing code patterns
      - Respect solv-context, angular-architecture, solv-design-system, gobernanza skills
    tdd: true
    test_command: "node tools/test-impact/cli.mjs plan --base origin/main --working-tree --output impact-plan.json && node tools/test-impact/run.mjs --all --plan impact-plan.json --report impact-report.json"
  verify:
    test_command: "node tools/test-impact/cli.mjs plan --base origin/main --working-tree --output impact-plan.json && node tools/test-impact/run.mjs --all --plan impact-plan.json --report impact-report.json && node tools/test-impact/cli.mjs report --file impact-report.json --plan impact-plan.json"
    build_command: "node tools/test-impact/cli.mjs plan --base origin/main --working-tree --output impact-plan.json && node tools/test-impact/run.mjs --partial --suite build --if-selected --plan impact-plan.json --report impact-report-build.json"
    lint_command: "node tools/test-impact/cli.mjs plan --base origin/main --working-tree --output impact-plan.json && node tools/test-impact/run.mjs --partial --suite gates --if-selected --plan impact-plan.json --report impact-report-gates.json"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

testing:
  strict_tdd: true
  backend_runner: "node tools/test-impact/cli.mjs plan --base origin/main --working-tree --output impact-plan.json && node tools/test-impact/run.mjs --partial --suite backend-unit --if-selected --plan impact-plan.json --report impact-report-backend-unit.json"
  backend_integration_env: "TEST_DB_DSN=postgres://solv_user:solv_password@127.0.0.1:5433/solv_test?sslmode=disable"
  frontend_runner: "node tools/test-impact/cli.mjs plan --base origin/main --working-tree --output impact-plan.json && node tools/test-impact/run.mjs --partial --suite frontend-unit --if-selected --plan impact-plan.json --report impact-report-frontend-unit.json"
  frontend_build: "node tools/test-impact/cli.mjs plan --base origin/main --working-tree --output impact-plan.json && node tools/test-impact/run.mjs --partial --suite build --if-selected --plan impact-plan.json --report impact-report-build.json"
  coverage_backend: "cd backend && go test -cover ./internal/core/... ./internal/delivery/..."
  coverage_frontend: "cd frontend && npx ng test --coverage"
  lint_styles: "node tools/test-impact/cli.mjs plan --base origin/main --working-tree --output impact-plan.json && node tools/test-impact/run.mjs --partial --suite gates --if-selected --plan impact-plan.json --report impact-report-gates.json"
  note: "Un comando --partial nunca valida el cambio completo. La validación global exige --all sobre todas las suites obligatorias y un informe validated=true con recibo HMAC y sidecar <informe>.evidence.json; en CI cada job usa SOLV_TEST_RECEIPT_KEY_<JOB>. Los comandos coverage_* son diagnóstico manual, no validación por impacto."
